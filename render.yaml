services:
  - type: web
    name: mr-masry-api
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: ./backend_fastapi/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_AUTO_INIT
        value: false
      - key: AI_SERVICE_ENABLED
        value: false
      - key: PYTHONPATH
        value: /app
